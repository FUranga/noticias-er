<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cablera — panel de curación</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 960px; margin: 0 auto; padding: 24px; background: #f7f7f5; color: #1a1a1a; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 20px; font-size: .9rem; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #ddd; }
  .tab { padding: 8px 14px; cursor: pointer; border: none; background: none; font-size: .9rem; color: #666; border-bottom: 2px solid transparent; }
  .tab.active { color: #111; border-bottom-color: #111; font-weight: 600; }
  .tab .count { color: #999; font-weight: 400; }
  .macro-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .macro-tab { padding: 9px 16px; cursor: pointer; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: .92rem; font-weight: 600; color: #555; }
  .macro-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .macro-tab .count { font-weight: 400; opacity: .75; }
  .item { background: #fff; border: 1px solid #e3e3e0; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .item h3 { margin: 0 0 4px; font-size: 1rem; }
  .meta { font-size: .8rem; color: #777; margin-bottom: 8px; }
  .meta a { color: #4a4a9e; }
  .texto { font-size: .85rem; color: #333; white-space: pre-wrap; max-height: 4.5em; overflow: hidden; margin-bottom: 8px; }
  .texto.expanded { max-height: none; }
  .toggle-texto { font-size: .78rem; color: #4a4a9e; cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 8px; display: inline-block; }
  .actions { display: flex; gap: 8px; }
  button.action { font-size: .82rem; padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; }
  button.publicar { border-color: #2f7d3c; color: #2f7d3c; }
  button.descartar { border-color: #a33; color: #a33; }
  button.reabrir { border-color: #555; color: #555; }
  button.investigar { border-color: #6a4fb3; color: #6a4fb3; }
  button.agenda { border-color: #b8860b; color: #b8860b; }
  .badge.agenda-badge { background: #fdf1d6; color: #96700a; }
  .badge.wp-badge { background: #e3f0e5; color: #2f7d3c; }
  .badge.sinfecha { background: #eee; color: #888; }
  .empty { color: #888; font-size: .9rem; padding: 20px 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .gear { cursor: pointer; font-size: 1.1rem; background: none; border: none; }
  dialog { border-radius: 10px; border: 1px solid #ddd; padding: 20px; width: 380px; max-width: 90vw; }
  dialog label { display: block; font-size: .82rem; margin: 10px 0 4px; color: #444; }
  dialog input { width: 100%; padding: 6px 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .badge { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 10px; background: #eee; color: #555; margin-left: 6px; }
  .badge.prioridad-alta { background: #fde3e3; color: #a33; }
  .badge.prioridad-media { background: #eee; color: #666; }
  .badge.prioridad-baja { background: #eee; color: #999; }
  .status-msg { font-size: .85rem; margin-bottom: 12px; }
  .status-msg.error { color: #a33; }
  .status-msg.ok { color: #2f7d3c; }

<body>

<div class="top-bar">
  <div>
    <h1>Cablera</h1>
    <div class="sub">Backlog de comunicados — marcá qué procesar. Esto no publica nada solo: <code>data/backlog.json</code> es la fuente que Claude Code lee para redactar y subir a WordPress como borrador.</div>
  </div>
  <button class="gear" id="btnConfig" title="Configuración de GitHub">⚙</button>

<div id="statusMsg"></div>

<div class="macro-tabs" id="macroTabs"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>

<dialog id="configDialog">
  <h3 style="margin-top:0">Configuración de GitHub</h3>
  <label>Owner / usuario</label>
  <input id="cfgOwner" placeholder="FUranga">
  <label>Repositorio</label>
  <input id="cfgRepo" placeholder="noticias-er">
  <label>Rama</label>
  <input id="cfgBranch" placeholder="main">
  <label>Ruta al archivo</label>
  <input id="cfgPath" placeholder="data/backlog.json">
  <label>Personal Access Token (fine-grained, scope Contents: Read and write, solo sobre este repo)</label>
  <input id="cfgToken" type="password" placeholder="github_pat_...">
  <div class="row">
    <button class="action" id="cfgCancel">Cancelar</button>
    <button class="action publicar" id="cfgSave">Guardar</button>

</dialog>

<dialog id="agendaDialog">
  <h3 style="margin-top:0" id="agendaDialogTitulo">Agregar a la agenda</h3>
  <label>Evento</label>
  <input id="agEvento" placeholder="Qué va a pasar">
  <label>Fecha (opcional, AAAA-MM-DD — dejalo vacío si es "próxima sesión" sin fecha exacta)</label>

  <label>Fuente</label>
  <input id="agFuente" placeholder="Organismo que lo informó">
  <label>Tipo</label>
  <select id="agTipo" style="width:100%;padding:6px 8px;box-sizing:border-box;border:1px solid #ccc;border-radius:5px;">
    <option value="evento">evento</option>
    <option value="sesión legislativa">sesión legislativa</option>
    <option value="trámite en comisión">trámite en comisión</option>
    <option value="plazo">plazo</option>
  </select>
  <label>Detalle (opcional)</label>
  <input id="agDetalle" placeholder="Contexto breve">
  <div class="row">
    <button class="action" id="agCancel">Cancelar</button>
    <button class="action publicar" id="agSave">Guardar</button>
  </div>
</dialog>

<script>
// Macro-pestañas: cambian TODA la vista, no solo un filtro adicional. Cada
// fuente con volumen y tratamiento propio (ver docs/boletin-oficial-proceso.md)
// tiene la suya -- un ítem del Boletín NO aparece en "Cablera" (evita el
// mismo problema de volumen que ya resolvimos con el filtro mecánico:
// mezclarlo todo de nuevo en un solo listado). Para sumar una fuente nueva
// con este tratamiento, agregarla acá. "agenda" no es una fuente de la
// cablera -- es su propia vista sobre data/agenda.json, ver renderAgenda().
const MACROS = [
  { key: 'general', label: 'Cablera' },
  { key: 'boletin', label: 'Boletín Oficial', fuente: 'Boletín Oficial de Entre Ríos' },
  // "Medios" filtra por prefijo de id (todos los items que carga
  // pipeline/monitorear_medios.py llevan "medios-"), no por un único
  // "fuente" como el Boletín -- acá hay muchos medios distintos, no uno.
  { key: 'medios', label: 'Medios', idPrefix: 'medios-', estadosMedios: true },
  // "Empresas" son comunicados propios de camaras/empresas (pipeline/
  // monitorear_empresas.py, prefijo "empresa-") -- a diferencia de
  // "Medios", esto SÍ es material propio de la fuente (como un comunicado
  // de gobierno), así que usa los ESTADOS normales (sin estadosMedios).
  // Volumen alto esperado (70+ fuentes) -- separada para no inundar
  // "Cablera" general.
  { key: 'empresas', label: 'Empresas', idPrefix: 'empresa-' },
  { key: 'agenda', label: 'Agenda', esAgenda: true },
];

// 4 estados reales para toda la cablera (2026-09-07: antes el Boletín tenía
// "a_investigar" y el resto no -- unificado porque un ítem de cualquier
// fuente puede necesitar más de un día de reporteo, no es exclusivo del
// Boletín). No hay estado "procesado": cuando un item ya tiene un borrador
// subido a WordPress, se marca con un check visual (wp_edit_url presente)
// sin sacarlo de su estado editorial.
const ESTADOS = [
  { key: 'pendiente', label: 'Pendientes' },
  { key: 'a_publicar', label: 'A publicar' },
  { key: 'a_investigar', label: 'A investigar' },
  { key: 'descartado', label: 'Descartadas' },
];

// Estados propios de "Medios" -- un ítem que viene de otro medio no se
// "reescribe" como un comunicado (ver docs/estilo-editorial.md, sección
// "Medios y empresas como fuente"): la mayoría de las veces el destino
// correcto es "Referir" (atribuir y linkear -- redes/newsletter/portada
// como referido), no "A publicar" (que sigue existiendo para el caso raro
// de una primicia grande que se decide trabajar yendo con el que la rompió
// primero, ver conversación de diseño 2026-09-07).
const ESTADOS_MEDIOS = [
  { key: 'pendiente', label: 'Pendientes' },
  { key: 'a_publicar', label: 'A publicar' },
  { key: 'referido', label: 'Referidos' },
  { key: 'a_investigar', label: 'A investigar' },
  { key: 'descartado', label: 'Descartadas' },
];

// Estados propios de un ítem de agenda (ver docs/agenda.md) -- distintos de
// los de la cablera, no confundir. "vencido_sin_seguimiento" era un estado
// MANUAL (había que acordarse de tocar un botón) -- reemplazado 2026-09-07
// por "descartado" (decisión editorial explícita de dejar de seguirlo) más
// una marca automática de "vencida" sobre cualquier ítem "pendiente" cuya
// fecha ya pasó (ver esVencida()) -- no hace falta declarar nada a mano
// para que se vea que algo quedó atrás.
//
// "Próximas 2 semanas" NO es un cuarto estado -- va aparte, como un toggle
// de vista sobre la lista de "A cubrir" (ver mostrarCalendario más abajo),
// no como una pestaña más en esta fila. Mezclarlo con los estados hacía
// pensar que era una categoría excluyente más, cuando en realidad es otro
// eje (cómo se agrupa lo pendiente, no en qué estado está).
const ESTADOS_AGENDA = [
  { key: 'pendiente', label: 'A cubrir' },
  { key: 'cubierto', label: 'Cubiertos' },
  { key: 'descartado', label: 'Descartados' },
];

const PRIORIDAD_ORDEN = { alta: 3, media: 2, baja: 1 };

const AGENDA_PATH = 'data/agenda.json';

let activeMacro = 'general';
let activeEstado = 'pendiente';
let activeAgendaEstado = 'pendiente';
// Toggle de vista sobre "A cubrir" -- no es un estado, ver comentario en
// ESTADOS_AGENDA. Solo tiene efecto cuando activeAgendaEstado === 'pendiente'.
let mostrarCalendario = true;

// Helpers de fecha para la agenda -- mediodía UTC al parsear para que
// formatear con toLocaleDateString no corra un día para atrás en husos
// horarios negativos (Argentina, UTC-3).
function hoyISO() {
  return new Date().toISOString().slice(0, 10);
}
function sumarDiasISO(dias) {
  const d = new Date();
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0, 10);
}
function formatFechaLarga(fechaISO) {
  const d = new Date(fechaISO + 'T12:00:00');
  const s = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function esVencida(a) {
  return a.estado === 'pendiente' && !!a.fecha && a.fecha < hoyISO();
}
let items = [];
let fileSha = null;
let agendaItems = [];
let agendaSha = null;
let agendaIds = new Set(); // origen_id de items de la cablera que ya estan en la agenda

function cfg() {
  return {
    owner: localStorage.getItem('cablera_owner') || '',
    repo: localStorage.getItem('cablera_repo') || '',
    branch: localStorage.getItem('cablera_branch') || 'main',
    path: localStorage.getItem('cablera_path') || 'data/backlog.json',
    token: localStorage.getItem('cablera_token') || '',
  };
}

function cfgReady() {
  const c = cfg();
  return c.owner && c.repo && c.token;
}

function setStatus(msg, kind) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg' + (kind ? ' ' + kind : '');
}

async function ghGetPath(path) {
  const c = cfg();
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}?ref=${encodeURIComponent(c.branch)}`;
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json' },
  });
  if (!res.ok) throw new Error(`GET ${res.status}: ${await res.text()}`);
  const data = await res.json();
  let b64 = data.content;
  if (!b64) {
    // La API de Contents no incluye el contenido para archivos > 1MB; hay que pedirlo via la API de blobs.
    const blobUrl = `https://api.github.com/repos/${c.owner}/${c.repo}/git/blobs/${data.sha}`;
    const blobRes = await fetch(blobUrl, {
      headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json' },
    });
    if (!blobRes.ok) throw new Error(`GET blob ${blobRes.status}: ${await blobRes.text()}`);
    b64 = (await blobRes.json()).content;
  }
  const content = decodeURIComponent(escape(atob(b64)));
  return { data: JSON.parse(content), sha: data.sha };
}

async function ghPutPath(path, sha, newContent, message) {
  const c = cfg();
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(newContent, null, 2) + '\n'))),
    sha,
    branch: c.branch,
  };
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`PUT ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.content.sha;
}

async function ghGet() {
  const c = cfg();
  const { data, sha } = await ghGetPath(c.path);
  fileSha = sha;
  return data;
}

// Serializa los guardados: si se dispara un segundo guardado mientras el
// anterior todavia esta en vuelo (ej. clickear "descartar" en varios items
// seguidos, sin esperar), sin esto los dos piden el archivo casi al mismo
// tiempo, agarran el mismo sha, y el segundo PUT siempre da 409 aunque cada
// uno relea antes de escribir. Con la cola, el segundo ni arranca su GET
// hasta que el primero termino su PUT.
let colaDeGuardado = Promise.resolve();
function encolarGuardado(tarea) {
  const resultado = colaDeGuardado.then(tarea, tarea);
  colaDeGuardado = resultado.catch(() => {});
  return resultado;
}

// Relee `path` justo antes de escribir, le aplica `mutar` a esa version
// fresca, y reintenta un par de veces si igual choca (ej. un commit
// automatico del pipeline de ingesta que entro en el instante exacto entre
// el GET y el PUT). Devuelve el contenido final ya guardado.
async function guardarConReintento(path, mutar, mensaje, intentos = 3) {
  return encolarGuardado(async () => {
    let ultimoError;
    for (let intento = 0; intento < intentos; intento++) {
      const { data: fresh, sha } = await ghGetPath(path);
      mutar(fresh);
      try {
        await ghPutPath(path, sha, fresh, mensaje);
        return fresh;
      } catch (e) {
        ultimoError = e;
        if (!/PUT 409/.test(e.message)) throw e;
      }
    }
    throw ultimoError;
  });
}

async function loadAgenda() {
  try {
    const { data, sha } = await ghGetPath(AGENDA_PATH);
    agendaItems = data;
    agendaSha = sha;
    agendaIds = new Set(data.map(a => a.origen_id).filter(Boolean));
  } catch (e) {
    // best-effort: si data/agenda.json todavia no existe o falla, seguimos sin badges
    agendaItems = [];
    agendaSha = null;
    agendaIds = new Set();
  }
}

async function load() {
  if (!cfgReady()) {
    setStatus('Configurá el acceso a GitHub con el ícono ⚙ de arriba a la derecha.', 'error');
    render();
    return;
  }
  try {
    setStatus('Cargando...');
    items = await ghGet();
    await loadAgenda();
    setStatus('');
  } catch (e) {
    setStatus('Error cargando el backlog: ' + e.message, 'error');
  }
  render();
}

async function setEstado(id, estado, extra) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  const prev = it.estado;
  it.estado = estado;
  if (extra) Object.assign(it, extra);
  render();
  try {
    setStatus('Guardando...');
    items = await guardarConReintento(cfg().path, (fresh) => {
      const freshIt = fresh.find(i => i.id === id);
      if (freshIt) {
        freshIt.estado = estado;
        if (extra) Object.assign(freshIt, extra);
      }
    }, `Cablera: ${id} → ${estado}`);
    setStatus('Guardado.', 'ok');
    render();
  } catch (e) {
    it.estado = prev;
    setStatus('Error guardando: ' + e.message, 'error');
    render();
  }
}

function descartarConMotivo(id) {
  const motivo = prompt('¿Por qué lo descartás? (opcional, pero ayuda a que la skill de noticiabilidad aprenda el criterio — dejalo vacío si no querés anotar nada)');
  setEstado(id, 'descartado', { motivo_descarte: motivo ? motivo.trim() : null });
}

function itemsEnMacro(macroKey) {
  const macro = MACROS.find(m => m.key === macroKey);
  if (macro.fuente) return items.filter(i => (i.fuente || '') === macro.fuente);
  if (macro.idPrefix) return items.filter(i => (i.id || '').startsWith(macro.idPrefix));
  // "general": todo lo que NO pertenece a ninguna fuente/prefijo con macro propia.
  const fuentesConMacroPropia = MACROS.filter(m => m.fuente).map(m => m.fuente);
  const prefijosConMacroPropia = MACROS.filter(m => m.idPrefix).map(m => m.idPrefix);
  return items.filter(i =>
    !fuentesConMacroPropia.includes(i.fuente || '') &&
    !prefijosConMacroPropia.some(p => (i.id || '').startsWith(p))
  );
}

function renderMacroTabs() {
  const el = document.getElementById('macroTabs');
  el.innerHTML = '';
  MACROS.forEach(m => {
    const count = m.esAgenda
      ? agendaItems.filter(a => a.estado === 'pendiente').length
      : itemsEnMacro(m.key).filter(i => i.estado === 'pendiente').length;
    const btn = document.createElement('button');
    btn.className = 'macro-tab' + (activeMacro === m.key ? ' active' : '');
    btn.innerHTML = `${m.label} <span class="count">${count}</span>`;
    btn.onclick = () => { activeMacro = m.key; activeEstado = 'pendiente'; render(); };
    el.appendChild(btn);
  });
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  const macro = MACROS.find(m => m.key === activeMacro);
  if (macro.esAgenda) {
    ESTADOS_AGENDA.forEach(e => {
      const count = agendaItems.filter(a => a.estado === e.key).length;
      const btn = document.createElement('button');
      btn.className = 'tab' + (activeAgendaEstado === e.key ? ' active' : '');
      btn.innerHTML = `${e.label} <span class="count">${count}</span>`;
      btn.onclick = () => { activeAgendaEstado = e.key; render(); };
      tabsEl.appendChild(btn);
    });
    return;
  }
  const enMacro = itemsEnMacro(activeMacro);
  const estados = macro.estadosMedios ? ESTADOS_MEDIOS : ESTADOS;
  estados.forEach(e => {
    const count = enMacro.filter(i => i.estado === e.key).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeEstado === e.key ? ' active' : '');
    btn.innerHTML = `${e.label} <span class="count">${count}</span>`;
    btn.onclick = () => { activeEstado = e.key; render(); };
    tabsEl.appendChild(btn);
  });
}

// "Referir" solo tiene sentido para items que vienen de otro medio (ver
// docs/estilo-editorial.md, "Medios y empresas como fuente") -- se detecta
// por el prefijo de id que usa pipeline/monitorear_medios.py, no por la
// pestaña activa (un item de Medios se puede ver desde otro lugar también).
function esDeMedios(it) {
  return (it.id || '').startsWith('medios-');
}

function referirConNota(id) {
  const nota = prompt('¿Por qué vale la pena referirlo? (opcional, para tener a mano al armar redes/newsletter/portada)');
  setEstado(id, 'referido', { nota_referido: nota ? nota.trim() : null });
}

function itemActions(it) {
  const wrap = document.createElement('div');
  wrap.className = 'actions';
  const deMedios = esDeMedios(it);
  if (it.estado === 'pendiente') {
    wrap.appendChild(mkBtn('Marcar para publicar', 'publicar', () => setEstado(it.id, 'a_publicar')));
    if (deMedios) wrap.appendChild(mkBtn('Referir', 'agenda', () => referirConNota(it.id)));
    wrap.appendChild(mkBtn('Marcar para investigar', 'investigar', () => setEstado(it.id, 'a_investigar')));
    wrap.appendChild(mkBtn('Descartar', 'descartar', () => descartarConMotivo(it.id)));
  } else if (it.estado === 'a_publicar') {
    wrap.appendChild(mkBtn('Volver a pendiente', 'reabrir', () => setEstado(it.id, 'pendiente')));
    if (deMedios) wrap.appendChild(mkBtn('Referir', 'agenda', () => referirConNota(it.id)));
    wrap.appendChild(mkBtn('Pasar a investigar', 'investigar', () => setEstado(it.id, 'a_investigar')));
    wrap.appendChild(mkBtn('Descartar', 'descartar', () => descartarConMotivo(it.id)));
  } else if (it.estado === 'a_investigar') {
    wrap.appendChild(mkBtn('Marcar para publicar', 'publicar', () => setEstado(it.id, 'a_publicar')));
    if (deMedios) wrap.appendChild(mkBtn('Referir', 'agenda', () => referirConNota(it.id)));
    wrap.appendChild(mkBtn('Volver a pendiente', 'reabrir', () => setEstado(it.id, 'pendiente')));
    wrap.appendChild(mkBtn('Descartar', 'descartar', () => descartarConMotivo(it.id)));
  } else if (it.estado === 'referido') {
    wrap.appendChild(mkBtn('Volver a pendiente', 'reabrir', () => setEstado(it.id, 'pendiente')));
    if (it.nota_referido) {
      const nota = document.createElement('span');
      nota.style.cssText = 'font-size:.82rem;color:#777;align-self:center;';
      nota.textContent = it.nota_referido;
      wrap.appendChild(nota);
    }
  } else if (it.estado === 'descartado') {
    wrap.appendChild(mkBtn('Reabrir', 'reabrir', () => setEstado(it.id, 'pendiente')));
  }
  // El check de "ya tiene borrador en WordPress" es independiente del estado
  // editorial (no lo cambia, no lo mueve de pestaña) -- ver
  // docs/boletin-oficial-proceso.md.
  if (it.wp_edit_url) {
    const a = document.createElement('a');
    a.href = it.wp_edit_url; a.target = '_blank'; a.textContent = 'Ver borrador en WordPress →';
    a.style.fontSize = '.82rem';
    wrap.appendChild(a);
  }
  // Independiente del estado de noticiabilidad: cualquier item puede tener
  // ademas un hecho futuro para la agenda (ver docs/agenda.md).
  wrap.appendChild(mkBtn(agendaIds.has(it.id) ? 'Agregar otro a agenda' : 'Agregar a agenda', 'agenda', () => abrirAgenda(it)));
  return wrap;
}

function mkBtn(label, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'action ' + cls;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function buildItemCard(it) {
  const div = document.createElement('div');
  div.className = 'item';
  const h3 = document.createElement('h3');
  h3.textContent = it.titulo || '(sin título)';
  div.appendChild(h3);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `${it.fuente || 'fuente desconocida'} · ${it.fecha || ''}` +
    (it.link ? ` · <a href="${it.link}" target="_blank">ver original</a>` : '') +
    (it.imagen_url ? ' <span class="badge">tiene imagen</span>' : '') +
    (it.prioridad ? ` <span class="badge prioridad-${it.prioridad}">prioridad ${it.prioridad}</span>` : '') +
    (agendaIds.has(it.id) ? ' <span class="badge agenda-badge">en agenda</span>' : '') +
    (it.wp_edit_url ? ' <span class="badge wp-badge">✓ en WordPress</span>' : '');
  div.appendChild(meta);

  if (it.estado === 'descartado' && it.motivo_descarte) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = `<em>Motivo: ${it.motivo_descarte}</em>`;
    div.appendChild(m);
  }

  if (it.texto_original) {
    const p = document.createElement('div');
    p.className = 'texto';
    p.textContent = it.texto_original;
    div.appendChild(p);
    const toggle = document.createElement('button');
    toggle.className = 'toggle-texto';
    toggle.textContent = 'ver más';
    toggle.onclick = () => {
      p.classList.toggle('expanded');
      toggle.textContent = p.classList.contains('expanded') ? 'ver menos' : 'ver más';
    };
    div.appendChild(toggle);
  }

  div.appendChild(itemActions(it));
  return div;
}

function render() {
  renderMacroTabs();
  const macro = MACROS.find(m => m.key === activeMacro);
  if (macro.esAgenda) {
    renderTabs();
    renderAgendaList();
    return;
  }
  renderTabs();
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = itemsEnMacro(activeMacro)
    .filter(i => i.estado === activeEstado)
    .sort((a, b) => {
      // Los que ya tienen borrador en WordPress van al final -- lo accionable
      // (todavía sin subir) queda arriba.
      const doneA = a.wp_edit_url ? 1 : 0;
      const doneB = b.wp_edit_url ? 1 : 0;
      if (doneA !== doneB) return doneA - doneB;
      return (PRIORIDAD_ORDEN[b.prioridad] || 0) - (PRIORIDAD_ORDEN[a.prioridad] || 0);
    });
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Nada acá por ahora.</div>';
    return;
  }
  filtered.forEach(it => list.appendChild(buildItemCard(it)));
}

function renderAgendaList() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  const addBar = document.createElement('div');
  addBar.style.cssText = 'margin-bottom:14px;display:flex;gap:8px;align-items:center;';
  addBar.appendChild(mkBtn('+ Agregar evento', 'publicar', () => abrirAgenda(null)));
  // Toggle de vista, solo tiene sentido mirando "A cubrir" -- ver comentario
  // en ESTADOS_AGENDA sobre por qué esto no es una pestaña más.
  if (activeAgendaEstado === 'pendiente') {
    const toggle = mkBtn(
      mostrarCalendario ? 'Ver lista completa' : 'Próximas 2 semanas',
      mostrarCalendario ? 'reabrir' : 'agenda',
      () => { mostrarCalendario = !mostrarCalendario; render(); }
    );
    addBar.appendChild(toggle);
  }
  list.appendChild(addBar);

  if (activeAgendaEstado === 'pendiente' && mostrarCalendario) {
    renderAgendaCalendario(list);
    return;
  }

  const filtered = agendaItems
    .filter(a => a.estado === activeAgendaEstado)
    .sort((a, b) => {
      if (!a.fecha && !b.fecha) return 0;
      if (!a.fecha) return 1; // sin fecha al final
      if (!b.fecha) return -1;
      return a.fecha.localeCompare(b.fecha);
    });
  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada acá por ahora.';
    list.appendChild(empty);
    return;
  }
  filtered.forEach(a => list.appendChild(buildAgendaCard(a)));
}

// Vista "Próximas 2 semanas": agrupa por día los pendientes con fecha
// dentro de la ventana hoy..hoy+13, saltando los días sin nada (una agenda
// vacía día por día no aporta, ver docs/agenda.md). Los pendientes sin
// fecha exacta o ya vencidos no entran acá -- siguen visibles en "A cubrir"
// con su badge correspondiente.
function renderAgendaCalendario(list) {
  const desde = hoyISO(), hasta = sumarDiasISO(13);
  const enVentana = agendaItems.filter(a => a.estado === 'pendiente' && a.fecha && a.fecha >= desde && a.fecha <= hasta);
  if (enVentana.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada agendado con fecha en los próximos 14 días.';
    list.appendChild(empty);
    return;
  }
  const porFecha = new Map();
  enVentana.forEach(a => {
    if (!porFecha.has(a.fecha)) porFecha.set(a.fecha, []);
    porFecha.get(a.fecha).push(a);
  });
  [...porFecha.keys()].sort().forEach(fecha => {
    const h = document.createElement('h3');
    h.style.cssText = 'margin:18px 0 8px;font-size:.95rem;color:#444;';
    h.textContent = formatFechaLarga(fecha) + (fecha === hoyISO() ? ' · hoy' : '');
    list.appendChild(h);
    porFecha.get(fecha).forEach(a => list.appendChild(buildAgendaCard(a, { ocultarFecha: true })));
  });
}

function buildAgendaCard(a, opts) {
  opts = opts || {};
  const div = document.createElement('div');
  div.className = 'item';
  const h3 = document.createElement('h3');
  h3.textContent = a.evento || '(sin descripción)';
  div.appendChild(h3);

  const vencida = esVencida(a);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = (opts.ocultarFecha ? '' : (a.fecha ? a.fecha : '<span class="badge sinfecha">sin fecha exacta</span>')) +
    (vencida ? ' <span class="badge prioridad-alta">vencida</span>' : '') +
    (a.tipo ? ` · ${a.tipo}` : '') +
    (a.fuente ? ` · ${a.fuente}` : '') +
    (a.origen_id ? ` · <a href="#" onclick="return false;" title="${a.origen_id}">ítem de la cablera</a>` : ' · agregado a mano');
  div.appendChild(meta);

  if (a.detalle) {
    const p = document.createElement('div');
    p.className = 'texto';
    p.style.maxHeight = 'none';
    p.textContent = a.detalle;
    div.appendChild(p);
  }

  const wrap = document.createElement('div');
  wrap.className = 'actions';
  if (a.estado === 'pendiente') {
    wrap.appendChild(mkBtn('Marcar cubierto', 'publicar', () => marcarAgenda(a.id, 'cubierto')));
    wrap.appendChild(mkBtn('Descartar', 'descartar', () => marcarAgenda(a.id, 'descartado')));
  } else {
    wrap.appendChild(mkBtn('Volver a "a cubrir"', 'reabrir', () => marcarAgenda(a.id, 'pendiente')));
  }
  div.appendChild(wrap);
  return div;
}

async function marcarAgenda(id, estado) {
  const a = agendaItems.find(x => x.id === id);
  if (!a) return;
  if (estado === 'cubierto') {
    const link = prompt('¿Link o referencia de la nota que lo cubrió? (opcional)');
    if (link) a.detalle = (a.detalle ? a.detalle + ' — ' : '') + `Cubierto: ${link.trim()}`;
  } else if (estado === 'descartado') {
    const motivo = prompt('¿Por qué lo descartás? (opcional)');
    if (motivo) a.detalle = (a.detalle ? a.detalle + ' — ' : '') + `Descartado: ${motivo.trim()}`;
  }
  const prev = a.estado;
  const detallePrev = a.detalle;
  a.estado = estado;
  render();
  try {
    setStatus('Guardando...');
    agendaItems = await guardarConReintento(AGENDA_PATH, (fresh) => {
      const freshA = fresh.find(x => x.id === id);
      if (freshA) {
        freshA.estado = estado;
        freshA.detalle = a.detalle;
      }
    }, `Agenda: ${id} → ${estado}`);
    setStatus('Guardado.', 'ok');
    render();
  } catch (e) {
    a.estado = prev;
    a.detalle = detallePrev;
    setStatus('Error guardando: ' + e.message, 'error');
    render();
  }
}

document.getElementById('btnConfig').onclick = () => {
  const c = cfg();
  document.getElementById('cfgOwner').value = c.owner;
  document.getElementById('cfgRepo').value = c.repo;
  document.getElementById('cfgBranch').value = c.branch;
  document.getElementById('cfgPath').value = c.path;
  document.getElementById('cfgToken').value = c.token;
  document.getElementById('configDialog').showModal();
};
let agendaTargetItem = null; // item de la cablera de origen, o null si es alta manual

function abrirAgenda(it) {
  agendaTargetItem = it;
  document.getElementById('agendaDialogTitulo').textContent = it ? 'Agregar a la agenda' : 'Agregar evento a la agenda';
  document.getElementById('agEvento').value = it ? (it.titulo || '') : '';
  document.getElementById('agFecha').value = '';
  document.getElementById('agFuente').value = it ? (it.fuente || '') : '';
  document.getElementById('agTipo').value = 'evento';
  document.getElementById('agDetalle').value = '';
  document.getElementById('agendaDialog').showModal();
}

document.getElementById('agCancel').onclick = () => document.getElementById('agendaDialog').close();
document.getElementById('agSave').onclick = async () => {
  const it = agendaTargetItem; // puede ser null (alta manual desde la pestaña Agenda)
  const evento = document.getElementById('agEvento').value.trim();
  if (!evento) { alert('Falta describir el evento.'); return; }
  const fecha = document.getElementById('agFecha').value.trim() || null;
  const fuente = document.getElementById('agFuente').value.trim();
  const tipo = document.getElementById('agTipo').value;
  const detalle = document.getElementById('agDetalle').value.trim() || null;
  document.getElementById('agendaDialog').close();
  const nuevo = {
    id: `${it ? it.id : 'manual'}-agenda-${Date.now()}`,
    fecha,
    evento,
    tipo,
    fuente,
    origen_id: it ? it.id : null,
    detalle,
    agregado_el: new Date().toISOString(),
    estado: 'pendiente',
  };
  try {
    setStatus('Guardando en la agenda...');
    agendaItems = await guardarConReintento(
      AGENDA_PATH,
      (fresh) => fresh.push(nuevo),
      `Agenda: agregar "${evento}"` + (it ? ` (desde ${it.id})` : ' (manual)')
    );
    if (it) agendaIds.add(it.id);
    setStatus('Agregado a la agenda.', 'ok');
    render();
  } catch (e) {
    setStatus('Error guardando en la agenda: ' + e.message, 'error');
  }
};

document.getElementById('cfgCancel').onclick = () => document.getElementById('configDialog').close();
document.getElementById('cfgSave').onclick = () => {
  localStorage.setItem('cablera_owner', document.getElementById('cfgOwner').value.trim());
  localStorage.setItem('cablera_repo', document.getElementById('cfgRepo').value.trim());
  localStorage.setItem('cablera_branch', document.getElementById('cfgBranch').value.trim() || 'main');
  localStorage.setItem('cablera_path', document.getElementById('cfgPath').value.trim() || 'data/backlog.json');
  localStorage.setItem('cablera_token', document.getElementById('cfgToken').value.trim());
  document.getElementById('configDialog').close();
  load();
};

load();
</script>
