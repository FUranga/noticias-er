name: Monitorear Boletin Oficial Nacional (menciones a Entre Rios)

on:
  schedule:
    # Una corrida diaria alcanza: el BORA publica una edicion por dia habil,
    # y a diferencia de un comunicado de prensa nadie nos "gana de mano" por
    # unas horas de diferencia en una norma ya publicada (mismo criterio que
    # el Boletin de Entre Rios, ver docs/boletin-oficial-proceso.md).
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitorear-boletin-nacional
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/requirements.txt

      - run: python pipeline/monitorear_boletin_nacional.py

      - name: Commit y push si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/backlog.json; then
            echo "Sin cambios en data/backlog.json, no hay nada que commitear."
          else
            git add data/backlog.json
            git commit -m "Cablera: menciones a Entre Rios en el Boletin Oficial nacional (automatico)"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (intento $intento), reintentando con rebase..."
              git fetch origin main
              git rebase origin/main
            done
          fi
