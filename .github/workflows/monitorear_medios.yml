name: Monitorear Medios

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitorear-medios
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/requirements.txt

      - run: python pipeline/monitorear_medios.py

      - name: Depurar pendientes de Medios (filtro mecanico + expiracion 48h)
        run: python pipeline/depurar_pendientes_medios.py

      - name: Commit y push si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/backlog.json data/log_filtro_medios.jsonl; then
            echo "Sin cambios, no hay nada que commitear."
          else
            git add data/backlog.json data/log_filtro_medios.jsonl
            git commit -m "Cablera: noticias nuevas de Medios (automatico)"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (intento $intento), reintentando con rebase..."
              git fetch origin main
              git rebase origin/main
            done
          fi
