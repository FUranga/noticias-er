name: Monitorear Tribunal de Cuentas ER

on:
  schedule:
    # Diario: el sitio publica Memorias/Convenios/Informes de auditoria con
    # muy baja frecuencia (a lo sumo unas pocas veces por anio) -- no hace
    # falta un intervalo corto como el de las fuentes de noticias.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitorear-tcer
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/requirements.txt

      - run: python pipeline/monitorear_tcer.py

      - name: Commit y push si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/backlog.json; then
            echo "Sin cambios en data/backlog.json, no hay nada que commitear."
          else
            git add data/backlog.json
            git commit -m "Cablera: documentos nuevos del Tribunal de Cuentas ER (automatico)"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (intento $intento), reintentando con rebase..."
              git fetch origin main
              git rebase origin/main
            done
          fi
