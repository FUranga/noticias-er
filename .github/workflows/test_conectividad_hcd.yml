name: Test conectividad HCD Parana (temporal)

on:
  workflow_dispatch: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar hcdparana.gob.ar
        run: |
          echo "=== Portada hcdparana.gob.ar ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://hcdparana.gob.ar/ || true

          echo ""
          echo "=== /feed/ ==="
          curl -s -A "Mozilla/5.0" https://hcdparana.gob.ar/feed/ | head -c 1500 || true

          echo ""
          echo "=== /wp-json/ ==="
          curl -s -A "Mozilla/5.0" https://hcdparana.gob.ar/wp-json/ | head -c 1000 || true

          echo ""
          echo "=== gobiernoabierto.hcdparana.gob.ar ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0" https://gobiernoabierto.hcdparana.gob.ar/ || true

          echo ""
          echo "=== descargar_norma.php?id=55000 (debe ser un PDF si funciona) ==="
          curl -s -o /dev/null -w "HTTP %{http_code} Content-Type: %{content_type}\n" -A "Mozilla/5.0" "https://gobiernoabierto.hcdparana.gob.ar/descargar_norma.php?id=55000" || true

          echo ""
          echo "=== diariosyactas.hcdparana.gob.ar ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0" https://diariosyactas.hcdparana.gob.ar/ || true
