name: Monitorear Boletín Oficial ER

on:
  schedule:
    # Dos corridas por dia habil (Francisco, 2026-09-06), no cada 15 min como
    # los otros dos monitores -- a diferencia de un comunicado de prensa, nadie
    # nos "gana de mano" al Boletin por minutos, y cada corrida levanta un job
    # completo (checkout + setup de Python + instalar pypdf), no solo un GET
    # liviano. 12:00 UTC = 09:00 ART (por si sale temprano) y 18:30 UTC = 15:30
    # ART (con margen sobre el unico dato que tenemos: una edicion quedo con
    # Last-Modified ~13:24 ART). El script ya guarda el Last-Modified real de
    # cada edicion nueva en data/log_filtro_boletin.jsonl -- ajustar este
    # horario cuando haya mas datos reales. Ver docs/boletin-oficial-proceso.md,
    # "Horario de corrida".
    - cron: "0 12 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitorear-boletin-er
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/requirements.txt

      - run: python pipeline/monitorear_boletin_er.py

      - name: Commit y push si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/backlog.json data/log_filtro_boletin.jsonl && [ -z "$(git status --porcelain data/log_filtro_boletin.jsonl)" ]; then
            echo "Sin cambios, no hay nada que commitear."
          else
            git add data/backlog.json data/log_filtro_boletin.jsonl
            git commit -m "Cablera: normas nuevas del Boletín Oficial de ER (automatico)"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (intento $intento), reintentando con rebase..."
              git fetch origin main
              git rebase origin/main
            done
          fi
